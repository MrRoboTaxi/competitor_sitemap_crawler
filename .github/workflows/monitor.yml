name: Monitor competitor sitemaps

on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a Bark test notification
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: competitor-sitemap-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test crawler
        run: python -m unittest discover -s tests
      - name: Run crawler
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL }}
        run: python competitor_sitemap_crawler.py ${{ inputs.test_notification && '--test-notification' || '' }}
      - name: Commit state and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state
          if [ -d reports ]; then git add reports; fi
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'chore: update competitor sitemap state'
            git push
          fi
